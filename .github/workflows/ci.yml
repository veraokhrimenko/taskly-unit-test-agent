# Deterministic checks for every pull request, independent of the unit test agent.
# The agent decides which tests to write; this workflow shows whether the code passes.
name: CI

on:
  # Every pull request, also one that changes only documentation: the three jobs are required
  # checks on main, and a required check that never starts would block the merge.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".agents/skills/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run test:coverage

  frontend:
    name: Frontend typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage

  agent-scripts:
    name: Agent skill scripts tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The last gate test runs the gate in its containers on this checkout, so it needs Docker.
      - run: node --test .agents/skills/*/scripts/*.test.mjs .github/scripts/*.test.mjs
        env:
          GATE_DOCKER_TESTS: "1"
